<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Finanzas Personales</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
  :root {
    --bg: #0a0b10;
    --bg2: #101218;
    --card: #15171f;
    --glass: rgba(255,255,255,.055);
    --glass-brd: rgba(255,255,255,.09);
    --ink: #0c0d12;
    --text: #f4f5f8;
    --text2: #9da1ad;
    --text3: #6b6f7c;
    --sep: #23252e;
    --blue: #3b82f6;
    --blue2: #5ea0ff;
    --green: #34d399;
    --red: #ff5d5d;
    --orange: #fbae3c;
    --yellow: #ffcc00;
    --purple: #af52de;
    --radius: 26px;
    --radius-sm: 16px;
    --radius-lg: 30px;
    --radius-pill: 999px;
    --shadow: 0 2px 10px rgba(0,0,0,.35), 0 18px 48px rgba(0,0,0,.4);
    --shadow-hero: 0 24px 70px rgba(0,0,0,.55);
    --ease-out: cubic-bezier(.23,1,.32,1);
    --ease-in-out: cubic-bezier(.77,0,.175,1);
    --ease-drawer: cubic-bezier(.32,.72,0,1);
    --nav-h: 88px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
  .press { transition: transform .15s var(--ease-out); }
  .press:active { transform: scale(.985); }
  /* premium dark building blocks */
  .glass { background: var(--glass); border: 1px solid var(--glass-brd);
    backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); }
  .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .2px; color: var(--text2);
    padding: 0 20px; margin: 26px 0 13px; }
  .h-scroll { display: flex; gap: 13px; overflow-x: auto; padding: 2px 16px 6px;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .h-scroll::-webkit-scrollbar { display: none; }
  .h-scroll > * { scroll-snap-align: start; }
  .qa { display: flex; align-items: center; gap: 7px; padding: 10px 15px; border-radius: var(--radius-pill);
    background: rgba(255,255,255,.13); color: #fff; font-size: 13px; font-weight: 600;
    border: 1px solid rgba(255,255,255,.15); cursor: pointer; transition: transform .14s var(--ease-out); }
  .qa:active { transform: scale(.94); }
  .qa svg { width: 15px; height: 15px; }
  .digital-card { position: relative; overflow: hidden; color: #fff; cursor: pointer;
    border-radius: 24px; padding: 18px 20px 17px;
    box-shadow: 0 12px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.22);
    transition: transform .18s var(--ease-out); -webkit-user-select: none; user-select: none; }
  .digital-card:active { transform: scale(.98); }
  .dc-shine { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(125deg, rgba(255,255,255,.18) 0%, transparent 34%, transparent 68%, rgba(255,255,255,.07) 100%); }
  .dc-chip { width: 32px; height: 23px; border-radius: 6px; position: relative; flex-shrink: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.88), rgba(255,255,255,.5)); }
  .dc-chip::after { content: ''; position: absolute; inset: 5px 6px; border: 1px solid rgba(0,0,0,.13); border-radius: 3px; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body, #root { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg); color: var(--text); overscroll-behavior: none;
  }
  #root { display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; position: relative;
    background: radial-gradient(135% 90% at 50% -8%, #1b2348 0%, #0c0e18 46%, #07080c 100%); }

  /* SCREEN STACK */
  .app-stack { position: relative; flex: 1; overflow: hidden; }
  .screen-view {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 24px);
    transition: transform .4s var(--ease-drawer), opacity .3s var(--ease-out);
    will-change: transform;
  }
  .screen-view.slide-in  { transform: translateX(0); opacity: 1; }
  .screen-view.slide-out { transform: translateX(-30%); opacity: 0; pointer-events: none; }
  .screen-view.slide-right { transform: translateX(100%); opacity: 0; pointer-events: none; }

  /* HEADER */
  .screen-header { padding: 60px 20px 10px; }
  .screen-title { font-size: 32px; font-weight: 700; letter-spacing: -.8px; }
  .screen-sub { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .detail-header {
    padding: 52px 16px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .back-btn {
    display: flex; align-items: center; gap: 3px;
    background: none; border: none; color: var(--blue);
    font-size: 17px; font-weight: 400; cursor: pointer; padding: 4px 0;
  }
  .back-btn svg { width: 20px; height: 20px; }

  /* NAV — floating dock */
  .bottom-nav {
    position: fixed; bottom: calc(16px + var(--safe-bottom)); left: 50%; transform: translateX(-50%);
    width: auto; height: 64px; padding: 8px;
    display: flex; gap: 4px; align-items: center;
    background: rgba(18,20,28,.72);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-brd);
    border-radius: var(--radius-pill);
    box-shadow: 0 14px 44px rgba(0,0,0,.55);
    z-index: 50;
  }
  .nav-pill {
    position: absolute; top: 8px; left: 8px;
    width: 92px; height: 48px; border-radius: var(--radius-pill);
    background: var(--blue); box-shadow: 0 6px 20px rgba(59,130,246,.55);
    transition: transform .34s var(--ease-out); z-index: 0;
  }
  .nav-btn {
    position: relative; z-index: 1;
    width: 92px; height: 48px; border-radius: var(--radius-pill);
    display: flex; flex-direction: column; gap: 2px;
    align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer;
    color: var(--text3); transition: color .22s var(--ease-out);
  }
  .nav-btn svg { width: 21px; height: 21px; }
  .nav-btn span { font-size: 10px; font-weight: 600; letter-spacing: .1px; }
  .nav-btn.active { color: #fff; }
  .nav-btn:active { transform: scale(.92); }

  /* Header add button */
  .head-add {
    margin-top: 4px; width: 36px; height: 36px; border-radius: 50%;
    background: var(--blue); color: #fff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,122,255,.35);
    transition: transform .12s;
  }
  .head-add:active { transform: scale(.92); }
  .head-add svg { width: 22px; height: 22px; }

  /* CARD WIDGET (list) */
  .card-list-item {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); margin: 0 16px 10px;
    overflow: hidden; animation: fadeUp .3s ease both;
    cursor: pointer; transition: transform .15s, box-shadow .15s;
    -webkit-user-select: none; user-select: none;
  }
  .card-flat {
    position: relative; overflow: hidden;
    margin: 0 16px 11px; border-radius: var(--radius);
    padding: 16px 18px 15px; color: #fff; cursor: pointer;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.16);
    animation: fadeUp .45s var(--ease-out) both;
    transition: transform .16s var(--ease-out);
    -webkit-user-select: none; user-select: none;
  }
  .card-flat::after {
    content: ''; position: absolute; top: 0; right: 0; width: 55%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.06));
    pointer-events: none;
  }
  .card-flat:active { transform: scale(.98); }
  .card-flat:nth-child(1){animation-delay:.03s}
  .card-flat:nth-child(2){animation-delay:.07s}
  .card-flat:nth-child(3){animation-delay:.11s}
  .card-flat:nth-child(4){animation-delay:.15s}
  .card-flat:nth-child(5){animation-delay:.19s}
  .card-flat:nth-child(6){animation-delay:.23s}
  .card-list-item:active { transform: scale(.985); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card-flat, .screen-view { animation: none !important; transition: opacity .2s ease !important; }
  }

  /* CC HEADER */
  .cc-header {
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 15px 16px 13px;
    color: #fff; position: relative; overflow: hidden;
  }
  .cc-name { font-size: 15px; font-weight: 700; }
  .cc-chips { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .cc-chip { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; background: rgba(255,255,255,.2); }
  .cc-amount { font-size: 27px; font-weight: 700; margin-top: 9px; letter-spacing: -.8px; }
  .cc-amount-label { font-size: 11px; opacity: .7; margin-top: 1px; }
  .cc-body { padding: 13px 16px 13px; }
  .cc-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .cc-stat { display: flex; flex-direction: column; }
  .cc-stat-val { font-size: 15px; font-weight: 600; }
  .cc-stat-lbl { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .bar-wrap { margin: 11px 0 0; }
  .bar-bg { background: var(--sep); border-radius: 4px; height: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .bar-labels { display: flex; justify-content: space-between; margin-top: 5px; }
  .bar-labels span { font-size: 11px; color: var(--text3); }
  .cc-days { display: flex; gap: 10px; margin-top: 8px; }
  .cc-day-badge {
    flex: 1; background: var(--bg); border-radius: var(--radius-sm);
    padding: 8px 6px; text-align: center;
  }
  .cc-day-badge .num { font-size: 20px; font-weight: 700; }
  .cc-day-badge .lbl { font-size: 10px; color: var(--text2); margin-top: 1px; }

  /* DETAIL TABS */
  .detail-tabs {
    display: flex; margin: 4px 16px 0;
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 3px;
  }
  .detail-tab {
    flex: 1; padding: 7px 0; border-radius: 8px;
    font-size: 13px; font-weight: 600; border: none;
    background: none; color: var(--text2); cursor: pointer;
    transition: all .2s;
  }
  .detail-tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.1); }

  /* EXPENSE ITEMS — compact */
  .expense-item-sm {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; cursor: pointer;
    transition: background .12s;
  }
  .expense-item-sm:active { background: var(--bg); }
  .expense-icon-sm {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; background: var(--bg);
  }
  .expense-info-sm { flex: 1; min-width: 0; }
  .expense-desc-sm { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .expense-meta-sm { font-size: 11px; color: var(--text2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .expense-amt-sm { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .expense-amt-sm.paid { color: var(--text3); text-decoration: line-through; }

  /* OLD expense items (kept for list view if any) */
  .list-wrap { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin: 12px 16px; }

  /* CHECK BUTTON */
  .check-btn {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--sep);
    background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s; flex-shrink: 0;
  }
  .check-btn.checked { background: var(--green); border-color: var(--green); }
  .check-btn svg { width: 13px; height: 13px; color: #fff; }

  /* MSI */
  .msi-item { padding: 14px 16px; border-bottom: 1px solid var(--sep); }
  .msi-item:last-child { border-bottom: none; }
  .msi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .msi-desc { font-size: 15px; font-weight: 500; }
  .msi-total { font-size: 15px; font-weight: 600; color: var(--blue); }
  .msi-meta { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .msi-dots { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .msi-dot {
    width: 30px; height: 30px; border-radius: 8px;
    border: 2px solid var(--sep); background: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: var(--text2);
    cursor: pointer; transition: all .2s; line-height: 1; text-align: center;
  }
  .msi-dot.paid { background: var(--blue); border-color: var(--blue); color: #fff; }
  .msi-dot.pre-paid { background: var(--text3); border-color: var(--text3); color: #fff; opacity: .7; }

  /* CATEGORY CHART */
  .cat-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--sep);
  }
  .cat-row:last-child { border-bottom: none; }
  .cat-emoji { font-size: 22px; width: 36px; text-align: center; flex-shrink: 0; }
  .cat-info { flex: 1; }
  .cat-name { font-size: 14px; font-weight: 500; }
  .cat-bar-wrap { margin-top: 4px; }
  .cat-amount { font-size: 14px; font-weight: 600; flex-shrink: 0; }

  /* MODAL / SHEET */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.62);
    z-index: 100; display: flex; align-items: flex-end;
    animation: fadeIn .2s ease; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    width: 100%; max-width: 430px; margin: 0 auto;
    background: var(--bg2); border: 1px solid var(--glass-brd); border-bottom: none;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 0 0 calc(24px + var(--safe-bottom));
    max-height: 92vh; overflow-y: auto;
    animation: slideUp .42s var(--ease-drawer);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.16); margin: 11px auto 4px; }
  .sheet-title { font-size: 18px; font-weight: 700; text-align: center; padding: 10px 20px 16px; letter-spacing: -.2px; }
  .sheet-body { padding: 0 20px; }
  .field { margin-bottom: 14px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .4px; display: block; margin-bottom: 7px; }
  .field input, .field select, .field textarea {
    width: 100%; background: rgba(255,255,255,.06); border: 1px solid var(--glass-brd); border-radius: var(--radius-sm);
    padding: 13px 15px; font-size: 16px; color: var(--text);
    font-family: inherit; outline: none; -webkit-appearance: none; appearance: none;
    transition: background .15s, border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { background: rgba(255,255,255,.09); border-color: var(--blue); }
  .field textarea { resize: none; min-height: 72px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .sheet-actions { display: flex; gap: 10px; padding: 16px 20px 0; }
  .btn-primary {
    flex: 1; padding: 15px; border-radius: var(--radius-sm);
    background: var(--blue); color: #fff;
    font-size: 16px; font-weight: 600; border: none; cursor: pointer;
    box-shadow: 0 8px 22px rgba(59,130,246,.4); transition: transform .14s var(--ease-out);
  }
  .btn-primary:active { transform: scale(.97); }
  .btn-danger { padding: 15px; border-radius: var(--radius-sm); background: rgba(255,93,93,.14); color: var(--red); font-size: 16px; font-weight: 600; border: none; cursor: pointer; }
  .btn-secondary { flex: 1; padding: 15px; border-radius: var(--radius-sm); background: rgba(255,255,255,.07); color: var(--text); font-size: 16px; font-weight: 600; border: 1px solid var(--glass-brd); cursor: pointer; }

  /* TOGGLE */
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,.05); border: 1px solid var(--glass-brd); border-radius: var(--radius-sm);
    padding: 14px; margin-bottom: 14px;
  }
  .toggle-label { font-size: 14px; font-weight: 500; flex: 1; padding-right: 12px; }
  .toggle-label small { display: block; font-size: 11px; color: var(--text2); font-weight: 400; margin-top: 2px; }
  .toggle-switch {
    position: relative; width: 51px; height: 31px; flex-shrink: 0;
    border-radius: 16px; background: rgba(255,255,255,.18);
    cursor: pointer; border: none; transition: background .25s;
  }
  .toggle-switch.on { background: var(--green); }
  .toggle-knob {
    position: absolute; top: 2px; left: 2px;
    width: 27px; height: 27px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4);
    transition: transform .25s var(--ease-out);
  }
  .toggle-switch.on .toggle-knob { transform: translateX(20px); }

  /* COLOR PICKER */
  .color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
  .color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform .15s; }
  .color-dot.selected { border-color: #fff; transform: scale(1.15); }

  /* GRADIENTS */
  .grad-yellow  { background: linear-gradient(145deg, #e8b332, #cf9a1e); }
  .grad-red     { background: linear-gradient(145deg, #e53935, #c1272d); }
  .grad-blue    { background: linear-gradient(145deg, #1f82dd, #1257a0); }
  .grad-skyblue { background: linear-gradient(145deg, #039be5, #0379b0); }
  .grad-purple  { background: linear-gradient(145deg, #ab47bc, #8b3a9c); }
  .grad-orange  { background: linear-gradient(145deg, #f4511e, #cc3f12); }
  .grad-green   { background: linear-gradient(145deg, #3a9540, #29702d); }

  /* COMMITMENTS */
  .month-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; }
  .month-tabs::-webkit-scrollbar { display: none; }
  .month-tab { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; background: var(--bg); color: var(--text2); border: none; cursor: pointer; transition: all .2s; }
  .month-tab.active { background: var(--blue); color: #fff; }
  .commit-item { padding: 14px 16px; border-bottom: 1px solid var(--sep); }
  .commit-item:last-child { border-bottom: none; }
  .commit-top { display: flex; justify-content: space-between; align-items: center; }
  .commit-desc { font-size: 15px; font-weight: 500; }
  .commit-amount { font-size: 15px; font-weight: 600; }
  .commit-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .summary-row { display: flex; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--sep); }
  .summary-row span { font-size: 13px; color: var(--text2); }
  .summary-row strong { font-size: 13px; font-weight: 700; }

  .item-edit-btn { background: none; border: none; color: var(--blue); font-size: 12px; font-weight: 600; cursor: pointer; padding: 3px 0; opacity: .7; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty .icon { font-size: 42px; margin-bottom: 8px; }
  .empty p { font-size: 14px; }
  select option { color: #000; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

// ─── CONSTANTS ──────────────────────────────────────────────────────────────
const COLORS = [
  { id:'yellow',  cls:'grad-yellow',  hex:'#e8b332' },
  { id:'red',     cls:'grad-red',     hex:'#e53935' },
  { id:'blue',    cls:'grad-blue',    hex:'#1976d2' },
  { id:'skyblue', cls:'grad-skyblue', hex:'#039be5' },
  { id:'purple',  cls:'grad-purple',  hex:'#ab47bc' },
  { id:'orange',  cls:'grad-orange',  hex:'#f4511e' },
  { id:'green',   cls:'grad-green',   hex:'#388e3c' },
];

const CATS = [
  '🛒 Supermercado','🍽️ Comida','⛽ Gasolina','🚗 Auto',
  '🏥 Salud','🎬 Entretenimiento','👕 Ropa','🏠 Hogar',
  '🔧 Servicios','✈️ Viajes','🎓 Educación','💊 Farmacia','💼 Negocio','📦 Otro',
];

const MONTHS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const today = new Date();
const currentMonth = today.getMonth();
const currentYear  = today.getFullYear();
const currentMK    = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;

const uid    = () => Math.random().toString(36).slice(2,10);
const fmt    = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const monthKey = (y,m) => `${y}-${String(m).padStart(2,'0')}`;
function hashStr(s) { let h=0; s=String(s||''); for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return h; }
function daysUntil(day) {
  const d = today.getDate();
  if (day >= d) return day - d;
  const next = new Date(today.getFullYear(), today.getMonth()+1, day);
  return Math.round((next - today) / 86400000);
}

// ─── STORAGE ─────────────────────────────────────────────────────────────────
function useStorage(key, init) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  const set = useCallback(v => {
    setVal(prev => {
      const next = typeof v === 'function' ? v(prev) : v;
      localStorage.setItem(key, JSON.stringify(next));
      return next;
    });
  }, [key]);
  return [val, set];
}

// ─── FINANCIAL MODEL ─────────────────────────────────────────────────────────
// card.available = exact bank balance entered by user. NEVER mutated.
//
// EXPENSES:
//   toggle OFF + not paid  → bank hasn't charged yet → subtract
//   toggle OFF + paid      → bank charged, credit freed → no adjustment (net 0 vs base)
//   toggle ON  + any       → already in base → 0
//
// MSI:
//   paidCount = cuotas pre-existing when user added the MSI (already in base available).
//   extraPaid = paid.length - paidCount  (cuotas newly palomeaded AFTER adding)
//   stillOwed = total - paid.length      (cuotas not yet palomeaded)
//   → each extraPaid cuota adds back to available (bank charged, freed credit)
//   → each stillOwed cuota subtracts from available (reserved future debt)
//
// IMPORTANT: if paidCount is missing (legacy data), treat ALL current paid[] as pre-existing
//            so opening an old MSI doesn't suddenly move the available balance.

function computeCardTotals(card, expenses, msis, payments=[]) {
  const totalCredit = parseFloat(card.total)||0;
  const extension   = parseFloat(card.extension)||0;
  const baseAvail   = parseFloat(card.available)||0;

  // ── Expense adjustment ──
  // The toggle (alreadyDiscounted) only affects whether we subtract when NOT paid.
  // Palomear (paid=true) ALWAYS frees credit — regardless of toggle.
  //
  //   alreadyDiscounted=false, paid=false  → bank hasn't charged yet   → subtract
  //   alreadyDiscounted=false, paid=true   → bank charged, now settled  → +amount (cancel the subtract)
  //   alreadyDiscounted=true,  paid=false  → bank already has it        → 0 (already in base)
  //   alreadyDiscounted=true,  paid=true   → paid & settled             → +amount (credit freed)
  //
  // Simplified: paid=true always adds back. paid=false only subtracts if NOT already discounted.
  let expAdj = 0;
  expenses.forEach(e => {
    const amount = parseFloat(e.amount)||0;
    if (e.paid) {
      expAdj += amount;          // paid: bank charged it AND user settled → credit freed → +
    } else if (!e.alreadyDiscounted) {
      expAdj -= amount;          // pending, bank hasn't charged yet → -
    }
    // alreadyDiscounted=true + not paid → 0 (already in base, still owed but bank tracks it)
  });

  // ── MSI adjustment ──
  // baseAvail already reflects ALL pre-existing paid cuotas (paidCount) — bank took them.
  // Only NEW cuotas palomeated AFTER adding the MSI to the app add credit back.
  // newlyPaid = paid.length - paidCount  (cuotas ticked by user in the app)
  let msiAdj = 0;
  msis.forEach(m => {
    const monthly   = parseFloat(m.monthly)||0;
    const paidKeys  = m.paid||[];
    const paidCount = m.paidCount !== undefined && m.paidCount !== ''
      ? parseInt(m.paidCount)||0
      : paidKeys.length; // legacy: treat all as pre-existing → no adjustment
    const newlyPaid = Math.max(0, paidKeys.length - paidCount);
    msiAdj += newlyPaid * monthly;
  });

  // ── Payments (abonos) ──
  // Dinero que transferiste a la tarjeta: libera crédito (sube disponible)
  // y baja tu total a pagar. No se ata a un gasto concreto.
  const totalPayments = payments.reduce((a,p)=>a+(parseFloat(p.amount)||0),0);

  const realAvail = baseAvail + expAdj + msiAdj + totalPayments;
  const creditLine = totalCredit + extension;
  const used    = creditLine - realAvail;
  const usedPct = creditLine > 0 ? (used / creditLine) * 100 : 0;

  // "Total a pagar": unpaid expenses + remaining MSI cuotas − pagos hechos
  const unpaidExp = expenses.filter(e=>!e.paid).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const pendMsi   = msis.reduce((a,m)=>{
    const stillOwed = (parseInt(m.total)||0) - (m.paid||[]).length;
    return a + stillOwed * (parseFloat(m.monthly)||0);
  },0);
  const totalToPay = Math.max(0, unpaidExp + pendMsi - totalPayments);

  // ── Cycle breakdown (expenses + MSI cuotas) ──
  const expThisCycle = expenses.filter(e=>!e.paid && dueMonthsAway(e.date, card.cutDay, card.payDay) <= 0).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const expNextCycle = expenses.filter(e=>!e.paid && dueMonthsAway(e.date, card.cutDay, card.payDay) === 1).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const { thisCycleMsi, nextCycleMsi } = getMsiCycleAmounts(msis);

  // Los pagos reducen primero lo del ciclo actual
  const thisCycle = Math.max(0, (expThisCycle + thisCycleMsi) - totalPayments);

  return { totalCredit, extension, realAvail, used, usedPct, totalToPay, totalPayments,
    cutDays: daysUntil(parseInt(card.cutDay)||1),
    payDays: daysUntil(parseInt(card.payDay)||15),
    thisCycle,
    nextCycle:  expNextCycle + nextCycleMsi,
  };
}

// ─── CYCLE HELPER ────────────────────────────────────────────────────────────
// Returns true if a date string falls AFTER the card's cut day (next billing cycle)
function isNextCycle(dateStr, cutDay) {
  if (!dateStr) return false;
  const [y,m,d] = dateStr.split('-').map(Number);
  const expDate = new Date(y, m-1, d);
  const cut = parseInt(cutDay)||1;
  const cutThisMonth = new Date(today.getFullYear(), today.getMonth(), cut);
  return expDate > cutThisMonth;
}

// Meses para PAGAR un gasto segun corte y pago: 0=este mes, 1=proximo...
function dueMonthsAway(dateStr, cutDay, payDay) {
  if (!dateStr) return 0;
  const [y,m,d] = dateStr.split('-').map(Number);
  const C = parseInt(cutDay)||1, P = parseInt(payDay)||15;
  let closeAbs = y*12 + (m-1);
  if (d > C) closeAbs += 1;
  const dueAbs = closeAbs + (P <= C ? 1 : 0);
  return dueAbs - (currentYear*12 + currentMonth);
}
function msiMonthAway(yi, mi) {
  return (yi*12 + mi) - (currentYear*12 + currentMonth);
}

// Returns the date string for a given cuota index of an MSI
function msiCuotaDate(msi, index) {
  const mi = (parseInt(msi.startMonth) + index) % 12;
  const yi = parseInt(msi.startYear) + Math.floor((parseInt(msi.startMonth) + index) / 12);
  // Use day 1 of that month as the billing date
  return `${yi}-${String(mi+1).padStart(2,'0')}-01`;
}

// Returns { thisCycleMsi, nextCycleMsi } — unpaid cuotas grouped by current/next cycle
function getMsiCycleAmounts(msis) {
  let thisCycleMsi = 0, nextCycleMsi = 0;
  msis.forEach(m => {
    const total    = parseInt(m.total)||0;
    const monthly  = parseFloat(m.monthly)||0;
    const paidKeys = m.paid||[];
    for (let i = 0; i < total; i++) {
      const mi = (parseInt(m.startMonth)+i)%12;
      const yi = parseInt(m.startYear)+Math.floor((parseInt(m.startMonth)+i)/12);
      const mk = monthKey(yi,mi);
      if (paidKeys.includes(mk)) continue;
      const away = msiMonthAway(yi, mi);
      if (away <= 0) thisCycleMsi += monthly;
      else if (away === 1) nextCycleMsi += monthly;
    }
  });
  return { thisCycleMsi, nextCycleMsi };
}

// Próximos 2 meses a pagar de UNA tarjeta: cuotas MSI de ese mes + (mes próximo) gastos del siguiente ciclo
function cardMonthsToPay(card, expenses, msis) {
  const out = [];
  for (let k=1;k<=2;k++){
    const d  = new Date(currentYear, currentMonth+k, 1);
    const mk = monthKey(d.getFullYear(), d.getMonth());
    let amount = 0;
    msis.forEach(m=>{
      const total=parseInt(m.total)||0, monthly=parseFloat(m.monthly)||0, paid=m.paid||[];
      for (let i=0;i<total;i++){
        const mi=(parseInt(m.startMonth)+i)%12;
        const yi=parseInt(m.startYear)+Math.floor((parseInt(m.startMonth)+i)/12);
        const cuotaMk=monthKey(yi,mi);
        if (cuotaMk===mk && !paid.includes(cuotaMk)) amount += monthly;
      }
    });
    amount += expenses.filter(e=>!e.paid && dueMonthsAway(e.date, card.cutDay, card.payDay) === k).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
    out.push({ label: MONTHS[d.getMonth()], year: d.getFullYear(), amount });
  }
  return out;
}

// ─── DETAIL: EXPENSES TAB ────────────────────────────────────────────────────
function fmtDateLabel(dateStr) {
  if (!dateStr) return '';
  const [y,m,d] = dateStr.split('-').map(Number);
  const date = new Date(y, m-1, d);
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((todayMid - new Date(y,m-1,d)) / 86400000);
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  return date.toLocaleDateString('es-MX',{day:'numeric',month:'short',year: y!==now.getFullYear()?'numeric':undefined}).toUpperCase();
}

function ExpensesTab({ expenses, cutDay, payDay, onToggle, onEdit }) {
  const thisCycleExp = expenses.filter(e => dueMonthsAway(e.date, cutDay, payDay) <= 0);
  const nextCycleExp = expenses.filter(e => dueMonthsAway(e.date, cutDay, payDay) >= 1);

  const pendThis = thisCycleExp.filter(e=>!e.paid).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const pendNext = nextCycleExp.filter(e=>!e.paid).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const paidAmt  = expenses.filter(e=>e.paid).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);

  // Group ALL expenses by date, newest first
  const sorted = [...expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const groups = [];
  sorted.forEach(exp => {
    const d = exp.date||'';
    const last = groups[groups.length-1];
    if (last && last.date===d) last.items.push(exp);
    else groups.push({ date:d, items:[exp] });
  });

  return (
    <>
      {/* ── Summary ── */}
      <div style={{margin:'2px 16px 10px',background:'var(--card)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',padding:'12px 16px',display:'flex',alignItems:'center'}}>
        <div style={{flex:1}}>
          <div style={{fontSize:17,fontWeight:600,letterSpacing:-.3,color:pendThis>0?'var(--red)':'var(--text)'}}>{fmt(pendThis)}</div>
          <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>Este ciclo</div>
        </div>
        {pendNext > 0 && (
          <>
            <div style={{width:1,alignSelf:'stretch',background:'var(--sep)'}}/>
            <div style={{flex:1,paddingLeft:14}}>
              <div style={{fontSize:17,fontWeight:600,letterSpacing:-.3,color:'var(--blue)'}}>{fmt(pendNext)}</div>
              <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>Sig. ciclo</div>
            </div>
          </>
        )}
        <div style={{width:1,alignSelf:'stretch',background:'var(--sep)'}}/>
        <div style={{flex:1,paddingLeft:14}}>
          <div style={{fontSize:17,fontWeight:600,letterSpacing:-.3,color:'var(--green)'}}>{fmt(paidAmt)}</div>
          <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>Pagado</div>
        </div>
      </div>
      <div style={{fontSize:11,color:'var(--text3)',margin:'-2px 18px 8px'}}>Solo gastos. El total con MSI está arriba en “A pagar por mes”.</div>

      {/* ── Grouped list ── */}
      {expenses.length === 0
        ? <div className="empty"><div className="icon">🧾</div><p>Sin gastos. Toca + Gasto para agregar.</p></div>
        : groups.map(group => {
          const groupIsNext = dueMonthsAway(group.date, cutDay, payDay) >= 1;
          return (
            <div key={group.date} style={{marginBottom:4}}>
              <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 20px 5px'}}>
                <span style={{fontSize:12,fontWeight:600,color:'var(--text3)',letterSpacing:.3,textTransform:'uppercase'}}>
                  {fmtDateLabel(group.date)}
                </span>
                {groupIsNext && (
                  <span style={{fontSize:10,fontWeight:700,color:'var(--blue)',background:'rgba(0,122,255,.1)',padding:'1px 7px',borderRadius:20}}>
                    Sig. ciclo
                  </span>
                )}
              </div>
              <div className="list-wrap" style={{margin:'0 16px'}}>
                {group.items.map((exp,idx) => (
                  <div key={exp.id} className="expense-item-sm"
                    style={{borderBottom: idx<group.items.length-1?'1px solid var(--sep)':'none'}}
                    onClick={()=>onEdit(exp)}>
                    <div className="expense-icon-sm">{exp.cat.split(' ')[0]}</div>
                    <div className="expense-info-sm">
                      <div className="expense-desc-sm">{exp.desc}</div>
                      <div className="expense-meta-sm">
                        {exp.cat.split(' ').slice(1).join(' ')}
                        {exp.note ? <> · <em>{exp.note}</em></> : null}
                      </div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                      <span className={`expense-amt-sm ${exp.paid?'paid':''}`}>{fmt(exp.amount)}</span>
                      <CheckBtn checked={exp.paid} onToggle={()=>onToggle(exp.id)}/>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })
      }
    </>
  );
}

// ─── DETAIL: MSI TAB ─────────────────────────────────────────────────────────
function MsiTab({ msis, onTogglePaid, onEdit }) {
  if (!msis.length) return (
    <div className="empty"><div className="icon">📅</div><p>Sin MSI. Toca + para agregar.</p></div>
  );
  return (
    <div className="list-wrap">
      {msis.map(item => {
        const total     = parseInt(item.total)||0;
        const monthly   = parseFloat(item.monthly)||0;
        const paidKeys  = item.paid||[];
        const paidCount = parseInt(item.paidCount)||0; // pre-existing cuotas
        const pct       = total>0?(paidKeys.length/total)*100:0;
        const remaining = total - paidKeys.length;
        const months    = Array.from({length:total},(_,i)=>{
          const mi = (parseInt(item.startMonth)+i)%12;
          const yi = parseInt(item.startYear)+Math.floor((parseInt(item.startMonth)+i)/12);
          return { num: i+1, key: monthKey(yi,mi), isPre: i < paidCount };
        });
        return (
          <div key={item.id} className="msi-item">
            {/* Title row */}
            <div className="msi-top">
              <span className="msi-desc">{item.desc}</span>
              <span className="msi-total" style={{color: remaining===0?'var(--green)':'var(--blue)'}}>
                {remaining===0 ? '✓ Pagado' : fmt(remaining*monthly)}
              </span>
            </div>

            {/* iOS-style subtitle */}
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
              <span style={{
                fontSize:12,fontWeight:600,color:'var(--text2)',
                background:'var(--bg)',borderRadius:6,padding:'2px 8px',
              }}>
                {paidKeys.length===total
                  ? `${total} de ${total} cuotas`
                  : `Pago ${paidKeys.length+1} de ${total}`}
              </span>
              <span style={{fontSize:12,color:'var(--text2)'}}>·</span>
              <span style={{fontSize:12,color:'var(--text2)'}}>{fmt(monthly)}/mes</span>
            </div>

            <ProgressBar pct={pct}/>

            {/* Cuota dots */}
            <div className="msi-dots" style={{marginTop:10}}>
              {months.map((m)=>{
                const isPaid = paidKeys.includes(m.key);
                const isNew  = isPaid && !m.isPre; // newly ticked by user
                return (
                  <button key={m.num}
                    className={`msi-dot ${isPaid?'paid':''} ${m.isPre&&isPaid?'pre-paid':''}`}
                    onClick={()=>onTogglePaid(item.id,m.key)}
                    title={`Cuota ${m.num}`}>
                    {isPaid ? (m.isPre ? '●' : '✓') : m.num}
                  </button>
                );
              })}
            </div>

            {/* Pending info */}
            {remaining > 0 && (
              <div style={{fontSize:12,color:'var(--text2)',marginTop:8}}>
                Quedan <strong style={{color:'var(--text)'}}>{remaining} cuotas</strong> · {fmt(remaining*monthly)} pendiente
              </div>
            )}

            <div style={{textAlign:'right',marginTop:6}}>
              <button className="item-edit-btn" onClick={()=>onEdit(item)}>editar</button>
            </div>
          </div>
        );
      })}
    </div>

// ─── DETAIL: CATEGORIES TAB ──────────────────────────────────────────────────
function CategoriesTab({ expenses }) {
  const data = useMemo(()=>{
    const map = {};
    expenses.forEach(e=>{
      const k = e.cat; const a = parseFloat(e.amount)||0;
      map[k] = (map[k]||0) + a;
    });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }, [expenses]);
  const max = data.length ? data[0][1] : 1;
  if (!data.length) return <div className="empty"><div className="icon">📊</div><p>Sin datos de categorías</p></div>;
  return (
    <div className="list-wrap">
      {data.map(([cat,amt])=>(
        <div key={cat} className="cat-row">
          <div className="cat-emoji">{cat.split(' ')[0]}</div>
          <div className="cat-info">
            <div className="cat-name">{cat.split(' ').slice(1).join(' ')}</div>
            <div className="cat-bar-wrap">
              <ProgressBar pct={(amt/max)*100} color="var(--blue)"/>
            </div>
          </div>
          <div className="cat-amount">{fmt(amt)}</div>
        </div>
      ))}
    </div>
  );
}

// ─── DETAIL: PAYMENTS TAB ────────────────────────────────────────────────────
function PaymentsTab({ payments, onEdit }) {
  if (!payments.length) return (
    <div className="empty"><div className="icon">💸</div><p>Sin pagos. Toca + Pago para registrar un abono a la tarjeta.</p></div>
  );
  const total  = payments.reduce((a,p)=>a+(parseFloat(p.amount)||0),0);
  const sorted = [...payments].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return (
    <>
      <div style={{margin:'2px 16px 10px',background:'var(--card)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',padding:'12px 16px'}}>
        <div style={{fontSize:17,fontWeight:600,letterSpacing:-.3,color:'var(--green)'}}>{fmt(total)}</div>
        <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>Total abonado</div>
      </div>
      <div className="list-wrap" style={{margin:'0 16px'}}>
        {sorted.map((p,idx)=>(
          <div key={p.id} className="expense-item-sm"
            style={{borderBottom: idx<sorted.length-1?'1px solid var(--sep)':'none'}}
            onClick={()=>onEdit(p)}>
            <div className="expense-icon-sm" style={{background:'rgba(52,199,89,.12)'}}>💸</div>
            <div className="expense-info-sm">
              <div className="expense-desc-sm">Pago{p.note?` · ${p.note}`:''}</div>
              <div className="expense-meta-sm">{fmtDateLabel(p.date)}</div>
            </div>
            <span className="expense-amt-sm" style={{color:'var(--green)'}}>+{fmt(p.amount)}</span>
          </div>
        ))}
      </div>
    </>
  );
}

// ─── CARD DETAIL SCREEN ──────────────────────────────────────────────────────
function CardDetail({ card, expenses, msis, payments, onBack, onEditCard,
    onToggleExpense, onEditExpense, onAddExpense,
    onToggleMsiPaid, onEditMsi, onAddMsi,
    onEditPayment, onAddPayment }) {
  const [activeTab, setActiveTab] = useState('gastos');
  const colorInfo = COLORS.find(c=>c.id===card.color)||COLORS[2];
  const { realAvail, usedPct, totalToPay, cutDays, payDays, totalCredit, extension, thisCycle } = computeCardTotals(card, expenses, msis, payments);
  // A pagar por mes (este mes + próximos 2), gastos + MSI
  const nextMonths = cardMonthsToPay(card, expenses, msis);
  const detailMonths = [
    { label:'Este mes', amount: thisCycle, current:true },
    ...nextMonths.map(m=>({ label:m.label, amount:m.amount, current:false })),
  ];

  const handleAdd = () => {
    if (activeTab === 'gastos') onAddExpense(card.id);
    else if (activeTab === 'msi') onAddMsi(card.id);
    else if (activeTab === 'pagos') onAddPayment(card.id);
  };

  return (
    <div className="screen-view slide-in" style={{paddingBottom:'calc(var(--nav-h) + var(--safe-bottom) + 32px)'}}>

      {/* Header nav */}
      <div className="detail-header">
        <button className="back-btn" onClick={onBack}><IconChevronLeft/>Tarjetas</button>
        <div style={{flex:1}}/>
        <button style={{background:'none',border:'none',color:'var(--blue)',fontSize:14,fontWeight:600,cursor:'pointer'}} onClick={()=>onEditCard(card)}>Editar</button>
      </div>

      {/* Card gradient banner */}
      <div style={{margin:'0 16px 10px'}}>
        <div className={`cc-header ${colorInfo.cls}`} style={{borderRadius:'var(--radius)'}}>
          <div className="cc-name">{card.name||'Sin nombre'}</div>
          <div className="cc-chips">
            <span className="cc-chip">{expenses.length} gastos</span>
            {msis.length>0&&<span className="cc-chip">{msis.length} MSI</span>}
          </div>
          <div className="cc-amount">{fmt(totalToPay)}</div>
          <div className="cc-amount-label">Total a Pagar</div>
        </div>
      </div>

      {/* Stats card */}
      <div style={{background:'var(--card)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',margin:'0 16px 10px',padding:'14px 16px'}}>
        <div className="cc-row">
          <div className="cc-stat">
            <span className="cc-stat-val">{fmt(realAvail)}</span>
            <span className="cc-stat-lbl">Disponible</span>
          </div>
          <div className="cc-stat" style={{alignItems:'flex-end'}}>
            <span className="cc-stat-val">{fmt(totalCredit+extension)}</span>
            <span className="cc-stat-lbl">Crédito Total</span>
          </div>
        </div>
        <div className="bar-wrap">
          <ProgressBar pct={usedPct}/>
          <div className="bar-labels"><span>{Math.round(usedPct)}% utilizado</span></div>
        </div>
        <div style={{display:'flex',gap:28,marginTop:12,paddingTop:11,borderTop:'1px solid var(--sep)'}}>
          <div>
            <div style={{fontSize:15,fontWeight:600,letterSpacing:-.2,color:cutDays<=5?'var(--red)':cutDays<=10?'var(--orange)':'var(--text)'}}>
              {cutDays}<span style={{fontSize:11,fontWeight:500,color:'var(--text3)'}}>d</span>
            </div>
            <div style={{fontSize:11,color:'var(--text3)',marginTop:1}}>Días para el corte</div>
          </div>
          <div>
            <div style={{fontSize:15,fontWeight:600,letterSpacing:-.2,color:payDays<=3?'var(--red)':payDays<=7?'var(--orange)':'var(--text)'}}>
              {payDays}<span style={{fontSize:11,fontWeight:500,color:'var(--text3)'}}>d</span>
            </div>
            <div style={{fontSize:11,color:'var(--text3)',marginTop:1}}>Días para el pago</div>
          </div>
        </div>
      </div>

      {/* ── A pagar por mes (gastos + MSI) ── */}
      <div style={{background:'var(--card)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',margin:'0 16px 10px',padding:'14px 16px 8px'}}>
        <div style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.6,marginBottom:2}}>
          A pagar por mes <span style={{fontWeight:500,textTransform:'none',letterSpacing:0}}>· gastos + MSI</span>
        </div>
        {detailMonths.map((m,i)=>(
          <div key={i} style={{
            display:'flex',justifyContent:'space-between',alignItems:'center',
            padding:'9px 0',
            borderTop: i>0 ? '1px solid var(--sep)' : 'none',
          }}>
            <span style={{fontSize:15,fontWeight:m.current?700:500,color:'var(--text)'}}>{m.label}</span>
            <span style={{fontSize:16,fontWeight:m.current?700:600,letterSpacing:-.3,color: m.current ? 'var(--blue)' : (m.amount>0?'var(--text)':'var(--text3)')}}>
              {fmt(m.amount)}

          </div>
        ))}
      </div>

      {/* ── Tabs + inline add button ── */}
      <div style={{
        background:'var(--card)',
        borderBottom:'1px solid var(--sep)',
        display:'flex', alignItems:'center',
        padding:'0 4px',
        position:'sticky', top:0, zIndex:10,
        boxShadow:'0 1px 0 var(--sep)',
      }}>
        {['gastos','msi','pagos','categorias'].map(t=>(
          <button key={t} onClick={()=>setActiveTab(t)} style={{
            flex:1, padding:'13px 0', border:'none', background:'none', cursor:'pointer',
            fontSize:14, fontWeight: activeTab===t ? 700 : 500,
            color: activeTab===t ? 'var(--text)' : 'var(--text2)',
            borderBottom: activeTab===t ? '2px solid var(--blue)' : '2px solid transparent',
            transition:'all .15s', marginBottom:-1,
          }}>
            {t==='gastos'?'Gastos':t==='msi'?'MSI':t==='pagos'?'Pagos':'Cat.'}
          </button>
        ))}
        {activeTab !== 'categorias' && (
          <button onClick={handleAdd} style={{
            background:'var(--blue)', color:'#fff', border:'none',
            borderRadius:10, padding:'7px 14px', margin:'0 8px',
            fontSize:13, fontWeight:700, cursor:'pointer', flexShrink:0,
            display:'flex', alignItems:'center', gap:5,
            boxShadow:'0 2px 8px rgba(0,122,255,.3)',
          }}>
            <span style={{fontSize:17,lineHeight:1,marginTop:-1}}>+</span>
            {activeTab==='gastos'?'Gasto':activeTab==='msi'?'MSI':'Pago'}
          </button>
        )}
      </div>

      {/* Tab Content */}
      <div style={{marginTop:8}}>
        {activeTab==='gastos'     && <ExpensesTab expenses={expenses} cutDay={card.cutDay} payDay={card.payDay} onToggle={onToggleExpense} onEdit={exp=>onEditExpense(exp,card.id)}/>}
        {activeTab==='msi'        && <MsiTab msis={msis} onTogglePaid={onToggleMsiPaid} onEdit={item=>onEditMsi(item,card.id)}/>}
        {activeTab==='pagos'      && <PaymentsTab payments={payments} onEdit={p=>onEditPayment(p,card.id)}/>}
        {activeTab==='categorias' && <CategoriesTab expenses={expenses}/>}
      </div>
    </div>
  );
}

function MsiForm({ initial, onSave, onDelete, onClose }) {
  const blank = {

          let prePaid = initial ? initial.paid : [];

          <input type="number" value={v} onChange={e=>setV(e.target.value)} placeholder="0.00" inputMode="decimal"/>
        </div>
      </div>
      <div className="sheet-actions">
        <button className="btn-secondary" onClick={onClose}>Cancelar</button>
        <button className="btn-primary" onClick={()=>{onSave(v);onClose();}}>Guardar</button>
      </div>
    </Sheet>
  );
}

// ─── RING (progreso circular) ─────────────────────────────────────────────────
function Ring({ pct, size=74, stroke=7, color='#fff', track='rgba(255,255,255,.18)', children }) {
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const off=c*(1-Math.min(1,Math.max(0,(pct||0)/100)));
  return (
    <div style={{position:'relative',width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track} strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={off} style={{transition:'stroke-dashoffset .8s var(--ease-out)'}}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>{children}</div>
    </div>
  );
}

// ─── DONUT (gasto por categoría) ──────────────────────────────────────────────
function Donut({ data, size=132, stroke=20 }) {
  const total = data.reduce((a,d)=>a+d.value,0) || 1;
  const r=(size-stroke)/2, c=2*Math.PI*r;
  let acc=0;
  return (
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,.06)" strokeWidth={stroke}/>
      {data.map((d,i)=>{
        const len=c*(d.value/total), gap=c-len, off=-acc; acc+=len;
        return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.color} strokeWidth={stroke}
          strokeDasharray={`${len} ${gap}`} strokeDashoffset={off}
          style={{transition:'stroke-dasharray .7s var(--ease-out)'}}/>;
      })}
    </svg>
  );
}

// ─── COMMITMENTS SCREEN ───────────────────────────────────────────────────────
function CommitmentsScreen({ commits, onEdit, onTogglePaid, selMonth, setSelMonth }) {
  const monthTabs = useMemo(()=>{
    const tabs=[];
    for(let i=-2;i<=8;i++){
      const d=new Date(currentYear,currentMonth+i,1);
      tabs.push({key:monthKey(d.getFullYear(),d.getMonth()),label:`${MONTHS[d.getMonth()]} ${d.getFullYear()}`});
    }
    return tabs;
  },[]);

  const active = commits.filter(c=>{
    const sm = monthKey(parseInt(c.year),parseInt(c.month));
    const months = parseInt(c.repeat)||1;
    const endDate = new Date(parseInt(c.year),parseInt(c.month)+months-1,1);
    const endMK = monthKey(endDate.getFullYear(),endDate.getMonth());
    return sm<=selMonth && selMonth<=endMK;
  });

  const totalPending = active.filter(c=>!((c.paidMonths||[]).includes(selMonth))).reduce((a,c)=>a+(parseFloat(c.amount)||0),0);
  const totalPaid    = active.filter(c=>(c.paidMonths||[]).includes(selMonth)).reduce((a,c)=>a+(parseFloat(c.amount)||0),0);

  return (
    <>
      <div className="month-tabs">
        {monthTabs.map(t=>(
          <button key={t.key} className={`month-tab ${selMonth===t.key?'active':''}`} onClick={()=>setSelMonth(t.key)}>{t.label}</button>
        ))}
      </div>
      {active.length===0
        ? <div className="empty"><div className="icon">📋</div><p>Sin pagos en este mes</p></div>
        : (
          <div style={{background:'var(--card)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)',margin:'0 16px 12px',overflow:'hidden'}}>
            {active.map(c=>{
              const isPaid=(c.paidMonths||[]).includes(selMonth);
              return (
                <div key={c.id+selMonth} className="commit-item">
                  <div className="commit-top">
                    <div style={{flex:1,minWidth:0}}>
                      <div className="commit-desc" style={{opacity:isPaid?.5:1,textDecoration:isPaid?'line-through':'none'}}>{c.desc}</div>
                      <div className="commit-meta">{c.cat.split(' ').slice(1).join(' ')} · {parseInt(c.repeat)>1?`${c.repeat} meses`:'Único'}</div>
                    </div>
                    <div style={{display:'flex',gap:10,alignItems:'center'}}>
                      <span className="commit-amount" style={{opacity:isPaid?.5:1}}>{fmt(c.amount)}</span>
                      <CheckBtn checked={isPaid} onToggle={()=>onTogglePaid(c.id,selMonth)}/>
                    </div>
                  </div>
                  <button className="item-edit-btn" onClick={()=>onEdit(c)}>editar</button>
                </div>
              );
            })}
            <div className="summary-row"><span>Pagado</span><strong style={{color:'var(--green)'}}>{fmt(totalPaid)}</strong></div>
            <div className="summary-row" style={{borderTop:'none',paddingTop:0}}><span>Pendiente</span><strong style={{color:'var(--red)'}}>{fmt(totalPending)}</strong></div>
          </div>
        )
      }
    </>
  );
}

function App() {
  const [tab, setTab]           = useState('home');
  const [detailCard, setDetail] = useState(null); // card obj | null
  const [cards, setCards]       = useStorage('fp_cards', []);
  const [expenses, setExpenses] = useStorage('fp_expenses', []);
  const [msis, setMsis]         = useStorage('fp_msis', []);
  const [payments, setPayments] = useStorage('fp_payments', []);
  const [commits, setCommits]   = useStorage('fp_commits', []);
  const [cash, setCash]         = useStorage('fp_cash', '');

  const [cardModal,   setCardModal]   = useState(null);
  const [expModal,    setExpModal]    = useState(null);
  const [msiModal,    setMsiModal]    = useState(null);
  const [payModal,    setPayModal]    = useState(null);
  const [commitModal, setCommitModal] = useState(null);
  const [cashModal,   setCashModal]   = useState(false);
  const [selMonth,    setSelMonth]    = useState(currentMK);

  // ── Card CRUD ──
  const saveCard = c => {
    if (c.id) setCards(p=>p.map(x=>x.id===c.id?{...c}:x));
    else setCards(p=>[...p,{...c,id:uid()}]);
  };
  const deleteCard = id => {
    setCards(p=>p.filter(x=>x.id!==id));
    setExpenses(p=>p.filter(x=>x.cardId!==id));
    setMsis(p=>p.filter(x=>x.cardId!==id));
    setPayments(p=>p.filter(x=>x.cardId!==id));
    setCardModal(null);
    setDetail(null);
  };

  // ── Expense CRUD ── (card.available is NEVER touched — everything is derived)
  const saveExpense = (f, cardId) => {
    if (f.id) setExpenses(p=>p.map(x=>x.id===f.id?{...f,cardId}:x));
    else setExpenses(p=>[...p,{...f,id:uid(),cardId,paid:false}]);
  };
  const deleteExpense = id => setExpenses(p=>p.filter(x=>x.id!==id));
  const toggleExpense = id => setExpenses(p=>p.map(x=>x.id===id?{...x,paid:!x.paid}:x));

  // ── MSI CRUD ── (card.available is NEVER touched — everything is derived)
  const saveMsi = (f, cardId) => {
    if (f.id) setMsis(p=>p.map(x=>x.id===f.id?{...f,cardId}:x));
    else setMsis(p=>[...p,{...f,id:uid(),cardId}]);
  };
  const deleteMsi = id => setMsis(p=>p.filter(x=>x.id!==id));
  const toggleMsiPaid = (id, mk) => {
    setMsis(p=>p.map(x=>{
      if(x.id!==id) return x;
      const paid=[...(x.paid||[])];
      const nowPaid = !paid.includes(mk);
      return {...x, paid: nowPaid ? [...paid,mk] : paid.filter(k=>k!==mk)};
    }));
  };

  // ── Payment CRUD ── (abonos a la tarjeta — suben disponible, bajan deuda)
  const savePayment = (f, cardId) => {
    if (f.id) setPayments(p=>p.map(x=>x.id===f.id?{...f,cardId}:x));
    else setPayments(p=>[...p,{...f,id:uid(),cardId}]);
  };
  const deletePayment = id => setPayments(p=>p.filter(x=>x.id!==id));

  // ── Commitments CRUD ──
  const saveCommit = f => {
    if(f.id) setCommits(p=>p.map(x=>x.id===f.id?{...f}:x));
    else setCommits(p=>[...p,{...f,id:uid(),paidMonths:[]}]);
  };
  const deleteCommit = id => { setCommits(p=>p.filter(x=>x.id!==id)); setCommitModal(null); };
  const toggleCommitPaid = (id,mk) => setCommits(p=>p.map(x=>{
    if(x.id!==id) return x;
    const pm=x.paidMonths||[];
    return {...x,paidMonths:pm.includes(mk)?pm.filter(k=>k!==mk):[...pm,mk]};
  }));

  // ── FAB — only for list screens ──
  const handleFab = () => {
    if (tab==='cards') setCardModal('new');
    else setCommitModal('new');
  };

  const showDetail = detailCard !== null;

  // ── Totales del inicio (todas las tarjetas) ──
  const homeTotals = useMemo(()=>{
    let grandTotal=0, thisMonth=0;
    cards.forEach(c=>{
      const t = computeCardTotals(
        c,
        expenses.filter(e=>e.cardId===c.id),
        msis.filter(m=>m.cardId===c.id),
        payments.filter(p=>p.cardId===c.id)
      );
      grandTotal += t.totalToPay;
      thisMonth  += t.thisCycle;
    });
    return { grandTotal, thisMonth, weekly: thisMonth/4 };
  }, [cards, expenses, msis, payments]);

  // ── A pagar por mes — GENERAL (próximos 2 meses, todas las tarjetas) ──
  const monthsToPay = useMemo(()=>{
    const out = [];
    for (let k=1;k<=2;k++){
      const d  = new Date(currentYear, currentMonth+k, 1);
      const mk = monthKey(d.getFullYear(), d.getMonth());
      let amount = 0;
      msis.forEach(m=>{
        const total=parseInt(m.total)||0, monthly=parseFloat(m.monthly)||0, paid=m.paid||[];
        for (let i=0;i<total;i++){
          const mi=(parseInt(m.startMonth)+i)%12;
          const yi=parseInt(m.startYear)+Math.floor((parseInt(m.startMonth)+i)/12);
          const cuotaMk=monthKey(yi,mi);
          if (cuotaMk===mk && !paid.includes(cuotaMk)) amount += monthly;
        }
      });
      expenses.forEach(e=>{
        if (e.paid) return;
        const card = cards.find(c=>c.id===e.cardId);
        const cut = card ? card.cutDay : 1, pay = card ? card.payDay : 15;
        if (dueMonthsAway(e.date, cut, pay) === k) amount += parseFloat(e.amount)||0;
      });
      out.push({ mk, label: MONTHS[d.getMonth()], year: d.getFullYear(), amount });
    }
    return out;
  }, [cards, expenses, msis, payments]);

  // ── Próximos pagos (tarjetas que vencen dentro de 15 días) ──
  const upcomingPayments = useMemo(()=>{
    const list = [];
    cards.forEach(c=>{
      const t = computeCardTotals(
        c,
        expenses.filter(e=>e.cardId===c.id),
        msis.filter(m=>m.cardId===c.id),
        payments.filter(p=>p.cardId===c.id)
      );
      const days = daysUntil(parseInt(c.payDay)||15);
      if (days <= 15 && t.thisCycle > 0) {
        const dd = parseInt(c.payDay)||15;
        const date = dd >= today.getDate()
          ? new Date(currentYear, currentMonth, dd)
          : new Date(currentYear, currentMonth+1, dd);
        const ci = COLORS.find(x=>x.id===c.color)||COLORS[2];
        list.push({ id:c.id, name:c.name||'Sin nombre', hex:ci.hex, amount:t.thisCycle, days, date });
      }
    });
    list.sort((a,b)=>a.days-b.days);
    return list;
  }, [cards, expenses, msis, payments]);

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div className="app-stack">

        {/* LIST SCREEN */}
        <div className={`screen-view ${showDetail ? 'slide-out' : 'slide-in'}`}>
          {tab==='home' && (
            <>
              {cards.length===0
                ? <>
                    <div className="screen-header">
                      <div className="screen-title">Inicio</div>
                      <div className="screen-sub">Agrega tarjetas para ver tu resumen</div>
                    </div>
                    <div className="empty"><div className="icon">📊</div><p>Sin datos aún. Agrega una tarjeta en la pestaña Tarjetas.</p></div>
                  </>
                : <HomeSummary {...homeTotals} upcoming={upcomingPayments} cash={cash} cards={cards} expenses={expenses} msis={msis} payments={payments} onEditCash={()=>setCashModal(true)} onOpenCard={(c)=>setDetail(c)} onAddCard={()=>setCardModal('new')} onAddCommit={()=>setCommitModal('new')}/>}
            </>
          )}
          {tab==='cards' && (
            <>
              <div className="screen-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
                <div>
                  <div className="screen-title">Tarjetas</div>
                  <div className="screen-sub">{cards.length===0?'Toca + para agregar tu primera tarjeta':`${cards.length} tarjeta${cards.length>1?'s':''}`}</div>
                </div>
                <button onClick={()=>setCardModal('new')} aria-label="Agregar tarjeta" className="head-add"><IconPlus/></button>
              </div>
              {cards.length===0 && <div className="empty"><div className="icon">💳</div><p>Sin tarjetas aún</p></div>}
              <div style={{padding:'4px 16px 0'}}>
                {cards.map((card,i)=>(
                  <div key={card.id} style={{marginTop:i===0?0:-10,animation:'fadeUp .5s var(--ease-out) both',animationDelay:`${i*60}ms`,position:'relative',zIndex:i+1}}>
                    <DigitalCard
                      card={card}
                      expenses={expenses.filter(e=>e.cardId===card.id)}
                      msis={msis.filter(m=>m.cardId===card.id)}
                      payments={payments.filter(p=>p.cardId===card.id)}
                      onClick={()=>setDetail(card)}
                    />
                  </div>
                ))}
              </div>
            </>
          )}
          {tab==='commits' && (
            <>
              <div className="screen-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
                <div>
                  <div className="screen-title">Pagos</div>
                  <div className="screen-sub">Pagos mensuales y únicos</div>
                </div>
                <button onClick={()=>setCommitModal('new')} aria-label="Agregar pago" className="head-add"><IconPlus/></button>
              </div>
              <CommitmentsScreen
                commits={commits}
                onEdit={c=>setCommitModal(c)}
                onTogglePaid={toggleCommitPaid}
                selMonth={selMonth}
                setSelMonth={setSelMonth}
              />
            </>
          )}
        </div>

        {/* DETAIL SCREEN */}
        {detailCard && (
          <div className={`screen-view ${showDetail ? 'slide-in' : 'slide-right'}`} style={{zIndex:10}}>
            <CardDetail
              card={cards.find(c=>c.id===detailCard.id)||detailCard}
              expenses={expenses.filter(e=>e.cardId===detailCard.id)}
              msis={msis.filter(m=>m.cardId===detailCard.id)}
              payments={payments.filter(p=>p.cardId===detailCard.id)}
              onBack={()=>setDetail(null)}
              onEditCard={c=>setCardModal(c)}
              onToggleExpense={toggleExpense}
              onEditExpense={(exp,cid)=>setExpModal({cardId:cid, cutDay:cards.find(c=>c.id===cid)?.cutDay, payDay:cards.find(c=>c.id===cid)?.payDay, exp})}
              onAddExpense={cid=>setExpModal({cardId:cid, cutDay:cards.find(c=>c.id===cid)?.cutDay, payDay:cards.find(c=>c.id===cid)?.payDay})}
              onToggleMsiPaid={toggleMsiPaid}
              onEditMsi={(item,cid)=>setMsiModal({cardId:cid,item})}
              onAddMsi={cid=>setMsiModal({cardId:cid})}
              onEditPayment={(pay,cid)=>setPayModal({cardId:cid, pay})}
              onAddPayment={cid=>setPayModal({cardId:cid})}
            />
          </div>
        )}
      </div>

      {/* BOTTOM NAV */}
      <nav className="bottom-nav">
        <div className="nav-pill" style={{transform:`translateX(${tab==='home'?0:tab==='cards'?96:192}px)`}}/>
        <button className={`nav-btn ${tab==='home'?'active':''}`} onClick={()=>{setTab('home');setDetail(null);}}>
          <IconHome/><span>Inicio</span>
        </button>
        <button className={`nav-btn ${tab==='cards'?'active':''}`} onClick={()=>{setTab('cards');setDetail(null);}}>
          <IconCards/><span>Tarjetas</span>
        </button>
        <button className={`nav-btn ${tab==='commits'?'active':''}`} onClick={()=>{setTab('commits');setDetail(null);}}>
          <IconList/><span>Pagos</span>
        </button>
      </nav>

      {/* MODALS */}
      {(cardModal==='new'||(cardModal&&cardModal.id)) && (
        <CardForm
          initial={cardModal==='new'?null:cardModal}
          onSave={saveCard}
          onDelete={deleteCard}
          onClose={()=>setCardModal(null)}
        />
      )}
      {expModal && (
        <ExpenseForm
          initial={expModal.exp||null}
          cutDay={expModal.cutDay||1}
          payDay={expModal.payDay||15}
          onSave={f=>saveExpense(f,expModal.cardId)}
          onDelete={deleteExpense}
          onClose={()=>setExpModal(null)}
        />
      )}
      {msiModal && (
        <MsiForm
          initial={msiModal.item||null}
          onSave={f=>saveMsi(f,msiModal.cardId)}
          onDelete={deleteMsi}
          onClose={()=>setMsiModal(null)}
        />
      )}
      {payModal && (
        <PaymentForm
          initial={payModal.pay||null}
          onSave={f=>savePayment(f,payModal.cardId)}
          onDelete={deletePayment}
          onClose={()=>setPayModal(null)}
        />
      )}
      {commitModal && (
        <CommitForm
          initial={commitModal==='new'?null:commitModal}
          onSave={saveCommit}
          onDelete={deleteCommit}
          onClose={()=>setCommitModal(null)}
        />
      )}
      {cashModal && (
        <CashForm
          initial={cash}
          onSave={v=>setCash(v)}
          onClose={()=>setCashModal(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
